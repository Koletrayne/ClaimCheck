<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a Classroom &middot; ClaimCheck</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="classroom.css" />
  <script src="theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="/">
      <svg class="logo-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
        <path d="M10 16l4 4 8-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="site-name">ClaimCheck</span>
    </a>
    <span class="cc-badge">Classroom</span>
    <div class="header-actions">
      <a class="cc-link" href="/classroom">About Classroom Mode</a>
    </div>
  </header>

  <main class="main cc-main">
    <div class="cc-join">
      <div class="intro">
        <h1 class="intro__title">Join your classroom</h1>
        <p class="intro__subtitle">Enter the code your teacher gave you.</p>
      </div>

      <form id="join-form" class="card" novalidate>
        <label class="cc-field__label" for="code-input">Classroom code</label>
        <input
          id="code-input"
          class="cc-code-input"
          type="text"
          inputmode="latin"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          maxlength="9"
          placeholder="ABCD-2345"
          aria-describedby="code-help"
        />
        <p id="code-help" class="cc-field__help" style="margin-top:8px">
          Eight letters and numbers. The dash is optional.
        </p>

        <div class="cc-form-actions">
          <button id="join-btn" class="btn-primary" type="submit">Join classroom</button>
        </div>

        <div id="join-error" class="cc-error" hidden role="alert"></div>
      </form>

      <p class="cc-note" style="border:none;text-align:center">
        You will not be asked to sign in or give your name, email, or any other
        personal information.
      </p>
    </div>
  </main>

  <script src="join.js"></script>
</body>
</html>
